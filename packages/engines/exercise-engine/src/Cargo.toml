[package]
name = "exercise-engine"
version = "1.0.0"
edition = "2021"
description = "Deterministic exercise engine for real-time pose analysis"
authors = ["AIVO Team"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
wasm-bindgen-test = "0.3"
