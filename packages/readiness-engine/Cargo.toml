[package]
name = "readiness-engine"
version = "1.0.0"
edition = "2021"
authors = ["AIVO Team"]
description = "Readiness score calculation engine for AIVO"
license = "MIT"
repository = "https://github.com/aivo-health/aivo"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-core = { path = "../wasm-core", package = "wasm-core" }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
