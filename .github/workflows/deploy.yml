name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  CI: true
  # The Cloudflare account id is an identifier, not a credential, so it lives
  # here rather than in repository secrets. The API token stays a secret.
  CLOUDFLARE_ACCOUNT_ID: fb243e7d5e9d8f9abe092940eac52539

jobs:
  deploy-api:
    name: Deploy API to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Only deploy when CI succeeded on main, or when manually dispatched.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the "packageManager" field in package.json.
        # Do not set "version" here: action-setup errors when both are present.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # The Worker needs the tables the code expects, so the migrations are
        # applied before the new code starts serving traffic.
        run: pnpm run db:migrate:remote

      - name: Deploy API
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # `pnpm run deploy` runs the package script; bare `pnpm deploy` would hit
        # pnpm's own built-in deploy command instead.
        run: pnpm run deploy

  deploy-web:
    name: Deploy Web to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the "packageManager" field in package.json.
        # Do not set "version" here: action-setup errors when both are present.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Web
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy
